site_name: xDrip
site_url: https://psonnera.github.io/xdrip_docs/

theme:
    name: material
    language: en
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.tracking
        - navigation.top
        - search.suggest
        - search.highlight
        - content.code.annotate
    logo: xDriplogo.png
    favicon: xDriplogo.png
    palette:
      primary: white
      scheme: default
    nav_style: primary

extra_css:
    - css/admonitions.css

markdown_extensions:
    - admonition
    - tables
    - attr_list
    - md_in_html
    - pymdownx.details
    - toc:
        permalink: ⌁

hooks:
    - hooks/i18n_notices.py

plugins:
  - search
  # Translations live next to the English page: page.md (en), page.fr.md, page.it.md.
  # Missing translations fall back to English. Workflow: i18n/README.md
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: xDrip
          nav_translations:
